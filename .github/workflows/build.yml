name: Build Wheel

on: [push]

jobs:
  build_wheel:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade build

      - name: Build distribution packages
        run: python -m build

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: dist/